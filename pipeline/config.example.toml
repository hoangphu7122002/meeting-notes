# Copy to ~/.config/meeting-notes/config.toml and edit. Every key is optional.

# Where `meeting-notes import` creates meeting folders when the app has no folder of its own.
# The app's Settings › Where to save (UserDefaults `notesDir`) wins over this key, so the app, its worker and
# `meeting-notes import` always use one folder; `MEETING_NOTES_DIR` still overrides both.
notes_dir = "~/MeetingNotes"

# Transcription: any mlx-whisper model (Hugging Face repo id or local path; a missing local path falls back
# to fp16 turbo with a warning).
#   mlx-community/whisper-large-v3-turbo-q4  (default: turbo 4-bit, ~0.44 GB, ~1.2 GB peak GPU memory)
#   mlx-community/whisper-large-v3-turbo     (fp16, same accuracy in our benchmark, ~2.3 GB peak, ~10% faster)
#   mlx-community/whisper-large-v3-mlx       (slower, slightly more accurate)
whisper_model = "mlx-community/whisper-large-v3-turbo-q4"
# Spoken languages to choose from (ISO 639-1). [] = let Whisper pick any language.
languages = ["vi", "en"]
# Custom vocabulary: people, products, jargon. Used by the whisper prompt (spelling) and by the summary
# (correct names and owners). Add a note after ":" for the summary only, e.g. "Tuấn: product lead".
glossary = []
# glossary = ["Momos", "Zalo", "Kubernetes", "OKR", "Tuấn: product lead", "Minh Anh"]
# Optional free-text hint placed before the glossary in the whisper prompt, e.g. "Họp sản phẩm hằng tuần."
initial_prompt = ""
# Voice-activity trimming per speaker block: skips blocks without voiced speech (keyboard, room noise) and
# cuts pauses >= vad_split_gap seconds, so whisper never decodes long silence (hallucinated "Thank you." etc.).
whisper_vad = true
vad_split_gap = 2.0
whisper_temperature_fallback = true        # re-decode degenerate windows at higher temperature
whisper_condition_on_previous_text = false # true feeds earlier text back in: more repeat loops
whisper_max_chunk_sec = 28.0               # whisper applies the prompt only to the first 30 s of each call
mlx_cache_limit_mb = 256                   # MLX buffer cache cap while transcribing (-1 = unbounded, ~2.5 GB more on 1 h)

# Diarization engine: "fluidaudio" (default) runs FluidAudio's Core ML port of pyannote community-1 on the Neural
# Engine through the helper CLI MeetingNotesDiarize, bundled in MeetingNotes.app and found automatically (app bundle,
# then app/.build, then PATH). Its ungated weights (~21 MB) download on first use into models/fluidaudio/, no login.
# If the helper is missing or fails, the pyannote path below runs instead (noted in transcript.json).
# "pyannote": the gated pyannote pipelines, tried in order (need HF_TOKEN + accepted terms), then an ungated
# voice-embedding clustering fallback. "sherpa-onnx" (opt-in, experimental): ungated ONNX models on CPU; needs
# `uv sync --extra sherpa` in pipeline/; models download on first use into models/sherpa-onnx/.
diarization_engine = "fluidaudio"
fluidaudio_cli = ""         # path override for the FluidAudio helper; empty = automatic
diarization_models = ["pyannote/speaker-diarization-community-1", "pyannote/speaker-diarization-3.1"]
cluster_threshold = 0.6     # clustering fallback only: lower splits voices more eagerly
diarization_device = "auto" # auto | mps | cpu (pyannote)
sherpa_embedding_model = "3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced"
sherpa_cluster_threshold = 0.9  # sherpa only: lower = more speakers
me_name = "Me"
mic_speakers = "auto"       # "me": everything on the microphone is you
# Check with a few voice embeddings whether the microphone holds only your voice; if sure, skip full
# diarization of the mic track (much faster; labels unchanged). Unsure or several voices: full diarization.
mic_voice_check = true

# Summary (local Ollama).
ollama_url = "http://127.0.0.1:11434"
ollama_model = "qwen3:4b"   # "qwen3:8b": better, ~2x RAM. The app's Settings › Summary quality overrides this key.
ollama_num_ctx = 12288
ollama_keep_alive = "1m"    # unload soon after the summary
ollama_num_thread = 4
ollama_preload = false      # true: load the summary model during transcription (faster, more RAM at once)
summary_chunk_chars = 18000 # longer transcripts are summarized in parts:
summary_extract_chars = 9000 # items are extracted per part of this size and merged in Python (no LLM merge)
# Summary template: general | one_on_one | standup | interview. Adds template sections (standup: updates,
# blockers; 1:1: feedback, growth; interview: strengths, concerns). A meeting.json "template" key wins.
summary_template = "general"
# Notes language: "auto" = Vietnamese when >= 40% of the speech is Vietnamese, else the main language.
summary_language = "auto"

# Resource use while processing.
priority = "low"            # low (nice + utility QoS) | background (gentlest, ~3x slower) | normal
cpu_threads = 4
diarization_batch_size = 8
keep_models_warm = "auto"   # keep whisper/pyannote between stages and queued meetings only under "normal" memory
                            # pressure, release on "warn"; false: unload after each stage; true: keep unless critical
worker_idle_release_min = 1.0

# Live transcript while recording (off by default; enable in the app: Settings > Recording > Live transcript while recording).
# The worker transcribes each chunk of speech during the meeting at low priority and reuses it after Stop,
# so less is left to transcribe. It never touches capture; skipped audio is transcribed after Stop as usual.
live_min_chunk_sec = 4.0      # chunks are cut at the first pause after this many seconds
live_max_chunk_sec = 28.0     # ... and forced at this length (forced chunks are re-transcribed after Stop)
live_pause_sec = 0.7          # a pause at least this long ends a chunk
live_max_backlog_sec = 120.0  # untranscribed audio beyond this is skipped live (oldest first)
live_on_battery = false       # true: also transcribe live on battery power
live_pause_pressure = "critical"  # "critical": live pauses only at critical memory pressure; "warn": also at warn
# Live polish (display only): "off" | "rules" = deterministic cleanup of live text (sentences split across
# chunks, casing, glossary spelling, decode loops, interjections like "ờ"/"um", paragraph breaks). Raw partials
# and the transcript after Stop are never changed; tone marks are never touched.
live_polish = "off"
live_polish_pause_sec = 2.5   # same-track pause that starts a new paragraph (a speaker change always does)
live_polish_max_words = 80    # close a paragraph after this many words

# Housekeeping.
keep_wav = false       # keep raw WAV recordings after the compressed .m4a copies are made
rename_folder = true   # rename "<date> Meeting" folders after the generated title
