[project]
name = "meeting-notes"
version = "0.1.0"
description = "Local meeting-notes pipeline: transcription, diarization and summary, all on-device."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "pyannote-audio>=4.0.7",
    "soundfile>=0.14.0",
]

[project.scripts]
meeting-notes = "meeting_notes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_notes"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
