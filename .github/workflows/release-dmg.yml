# Build the release dmg on a GitHub macOS runner. DISABLED on purpose: manual trigger only (no tag/push trigger),
# it uploads a workflow artifact and never creates a GitHub Release. Real releases are built locally with
# scripts/release.sh and the stable self-signed identity (docs/release.md): this runner signs ad-hoc, and an
# ad-hoc build makes every user grant Microphone and Screen & System Audio again after updating.
name: release-dmg (manual, disabled)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z"
        required: true

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-15  # Apple Silicon
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
      - name: Build dmg (ad-hoc signed, not published)
        env:
          CODESIGN_IDENTITY: "-"
        run: scripts/release.sh --version "${{ inputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingNotes-${{ inputs.version }}
          path: |
            build/release/MeetingNotes-*.dmg
            build/release/SHA256SUMS.txt
          retention-days: 7
