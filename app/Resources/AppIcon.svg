<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4B52D6"/>
      <stop offset="1" stop-color="#1B1F6B"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <!-- sound wave -->
  <g fill="#fff">
    <rect x="218" y="360" width="48" height="104" rx="24"/>
    <rect x="308" y="300" width="48" height="224" rx="24"/>
    <rect x="398" y="224" width="48" height="376" rx="24"/>
    <rect x="488" y="270" width="48" height="284" rx="24"/>
    <rect x="578" y="196" width="48" height="432" rx="24"/>
    <rect x="668" y="300" width="48" height="224" rx="24"/>
    <rect x="758" y="360" width="48" height="104" rx="24"/>
  </g>
  <!-- note lines -->
  <g fill="#fff" fill-opacity="0.85">
    <rect x="222" y="680" width="580" height="40" rx="20"/>
    <rect x="222" y="756" width="580" height="40" rx="20" fill-opacity="0.6"/>
    <rect x="222" y="832" width="360" height="40" rx="20" fill-opacity="0.4"/>
